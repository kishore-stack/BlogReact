name: Blog Application CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend lint
        run: npm run lint

      - name: Run backend tests
        run: npm test

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: self-hosted

    # Run only for trusted pushes, not public pull requests
    if: github.event_name == 'push'

    env:
      SONAR_SCANNER_HOME: 'C:\sonar-scanner\sonar-scanner-7.2.0.5079-windows-x64'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run SonarQube analysis
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          & "$env:SONAR_SCANNER_HOME\bin\sonar-scanner.bat" `
            "-Dsonar.projectKey=blogreact" `
            "-Dsonar.sources=backend,frontend" `
            "-Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**" `
            "-Dsonar.host.url=http://localhost:9000" `
            "-Dsonar.token=$env:SONAR_TOKEN"