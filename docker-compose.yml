
services:
  mysql:
    image: mysql:8.0
    container_name: compose-blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: RootPass123!
      MYSQL_DATABASE: blogdb
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: BlogPass123!
    ports:
      - "3308:3306"
    volumes:
      - compose-blog-mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: blogapp-backend:compose
    container_name: compose-blog-backend
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bloguser
      DB_PASSWORD: BlogPass123!
      DB_NAME: blogdb
      JWT_SECRET: blogapp-compose-secret-change-before-production
      CORS_ORIGIN: http://localhost:8081
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5002:5000"

  frontend:
    build: ./frontend
    image: blogapp-frontend:compose
    container_name: compose-blog-frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 5000
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  compose-blog-mysql-data: