
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: blog-app
  labels:
    app: frontend
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: blogapp-frontend:1.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          env:
            - name: BACKEND_HOST
              value: backend-service

            - name: BACKEND_PORT
              value: "5000"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"

            limits:
              cpu: "300m"
              memory: "256Mi"